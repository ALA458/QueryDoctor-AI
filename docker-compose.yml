name: querydoctor

services:
  # ------------------------------------------------------------------
  # PostgreSQL 16 + pgvector: repositorio propio de la plataforma (ADR-03)
  # ------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-querydoctor}
      POSTGRES_USER: ${POSTGRES_USER:-querydoctor}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ------------------------------------------------------------------
  # SQL Server 2022 Developer: base de LABORATORIO que la plataforma analiza
  # ------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    secrets:
      - mssql_sa_password
    # La imagen no lee la contraseña desde un archivo: la exportamos desde el secreto al arrancar.
    entrypoint:
      - /bin/bash
      - -c
      - export MSSQL_SA_PASSWORD="$$(cat /run/secrets/mssql_sa_password)" && exec /opt/mssql/bin/sqlservr
    volumes:
      - mssqldata:/var/opt/mssql
    ports:
      - "127.0.0.1:1433:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$(cat /run/secrets/mssql_sa_password)" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - targets

  # API: Identity, RBAC, REST y cliente de Hangfire. NO llega a bases objetivo ni al LLM.
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENV:-Development}
      # La contraseña de PostgreSQL llega como secreto (archivo), no en la cadena de conexión.
      Postgres__Host: db
      Postgres__Database: ${POSTGRES_DB:-querydoctor}
      Postgres__Username: ${POSTGRES_USER:-querydoctor}
      Postgres__PasswordFile: /run/secrets/postgres_password
      # Desarrollo: aplica las migraciones al arrancar. En producción se desactiva.
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-true}
      # Primer DBA (S1-06): contraseña desde secreto, cambio obligatorio en el primer ingreso.
      InitialDba__UserName: dba
      InitialDba__PasswordFile: /run/secrets/initial_dba_password
      # S1-09: clave maestra de SecretProtector (AES-256-GCM) para cifrar credenciales antes de guardarlas (RNF-SEG-04).
      Security__SecretProtector__MasterKeyPath: /run/secrets/master_encryption_key
    secrets:
      - postgres_password
      - initial_dba_password
      - master_encryption_key
    networks:
      - frontend
      - backend
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  # Worker: servidor de Hangfire, Gateway, ingesta y motor. Único que llega a bases objetivo.
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${APP_ENV:-Development}
      # Auditoría B6: el candado de TLS del laboratorio también se niega con APP_ENV=prod.
      APP_ENV: ${APP_ENV:-}
      # S1-09: sin esta conexión el Worker no registra servidores Hangfire y probe_connection nunca corre.
      Postgres__Host: db
      Postgres__Database: ${POSTGRES_DB:-querydoctor}
      Postgres__Username: ${POSTGRES_USER:-querydoctor}
      Postgres__PasswordFile: /run/secrets/postgres_password
      # S1-09: misma clave maestra que la api, para descifrar las credenciales al sondear.
      Security__SecretProtector__MasterKeyPath: /run/secrets/master_encryption_key
      # La excepción de TLS del laboratorio NO va aquí: solo en docker-compose.lab.yml (invariante 3).
    secrets:
      - postgres_password
      - master_encryption_key
    networks:
      - backend
      - targets
    depends_on:
      db:
        condition: service_healthy
      # La api aplica las migraciones al arrancar; el Worker lee core.connection y el esquema de Hangfire.
      api:
        condition: service_healthy


  # Web: Nginx. Único servicio publicado. Sirve el front y hace de proxy hacia la API.
  web:
    build:
      context: ./web
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    networks:
      - frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy

  # Servicio de IA: FastAPI con adaptador de LLM integrado (S1-18, ADR-02, ADR-10). Única salida a Internet (egress-ai).
  ai:
    build:
      context: ./ai-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LLM_PROFILE: ${LLM_PROFILE:-openrouter_free}
      ALLOW_DATA_SHARING_PROVIDER: ${ALLOW_DATA_SHARING_PROVIDER:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    networks:
      - backend
      - egress-ai
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
volumes:
  pgdata:
  mssqldata:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  mssql_sa_password:
    file: ./secrets/mssql_sa_password.txt
  initial_dba_password:
    file: ./secrets/initial_dba_password.txt
  # S1-09: 32 bytes aleatorios en Base64 (ver docs/NOTAS_S1-09_EQUIPO.md, P9). Ignorado por Git.
  master_encryption_key:
    file: ./secrets/master_encryption_key.txt

networks:
  frontend: # navegador -> web -> api
  backend: # api, worker, ai, db
  targets: # worker -> bases objetivo
  egress-ai: # ai -> proveedor de LLM
