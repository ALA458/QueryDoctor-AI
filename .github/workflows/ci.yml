name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    dotnet:
        name: .NET (build, format y pruebas)
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Descargar codigo
              uses: actions/checkout@v7

            - name: Setup de .NET
              uses: actions/setup-dotnet@v6
              with:
                global-json-file: global.json

            - name: Restaurar paquetes (incluye NuGet Audit)
              run: dotnet restore

            - name: Compilar
              run: dotnet build --no-restore --configuration Release

            - name: Verificar formato
              run: dotnet format --no-restore --verify-no-changes

            - name: Pruebas
              run: dotnet test --no-build --configuration Release

            - name: Ejecutar arnes del motor (CA-HU20.1)
              run: dotnet run --project tools/QueryDoctor.EngineHarness --no-build --configuration Release -- --corpus all

    # S3-06 (RNF-COM-01): pruebas de aceptación contra SQL Server real, una vez por plataforma de la matriz de soporte.
    # Corre LabTests y AcceptanceTests con QD_LAB_SQL definida: aquí no hay Skipped por falta de laboratorio (D7).
    # SQL Server se arranca con "docker run" y no como "services:", porque un contenedor de servicio necesita la
    # contraseña de sa antes de los pasos: tendría que estar en este archivo (invariante 4) o en un secreto manual.
    # Aquí las contraseñas se generan al azar en cada corrida, se enmascaran y no salen del runner.
    acceptance:
        name: Aceptacion (${{ matrix.platform }})
        runs-on: ubuntu-latest
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: sql2022
                      image: mcr.microsoft.com/mssql/server:2022-latest
                    - platform: sql2019
                      image: mcr.microsoft.com/mssql/server:2019-latest

        steps:
            - name: Descargar codigo
              uses: actions/checkout@v7

            - name: Setup de .NET
              uses: actions/setup-dotnet@v6
              with:
                global-json-file: global.json

            - name: Generar contrasenas del laboratorio (solo esta corrida)
              run: |
                sa="Qd!9a$(openssl rand -hex 16)"
                reader="Rd!9a$(openssl rand -hex 16)"
                echo "::add-mask::$sa"
                echo "::add-mask::$reader"
                printf '%s' "$reader" > "$RUNNER_TEMP/mssql_reader_password.txt"
                {
                  echo "SA_PASSWORD=$sa"
                  echo "READER_PASSWORD=$reader"
                  echo "QD_LAB_READER_PASSWORD_FILE=$RUNNER_TEMP/mssql_reader_password.txt"
                } >> "$GITHUB_ENV"

            - name: Arrancar SQL Server (${{ matrix.image }})
              run: |
                docker run -d --name qd-lab -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
                  -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -p 127.0.0.1:1433:1433 "${{ matrix.image }}"

            - name: Preparar el laboratorio (lab/sql 01, 04, 02, 03, 11 y carga 05 + 12 dos veces)
              run: bash lab/ci/prepare-acceptance-lab.sh qd-lab

            - name: Restaurar paquetes (incluye NuGet Audit)
              run: dotnet restore

            - name: Compilar
              run: dotnet build --no-restore --configuration Release

            - name: Pruebas de laboratorio y de aceptacion
              env:
                QD_LAB_SQL: 127.0.0.1
                QD_LAB_PLATFORM: ${{ matrix.platform }}
              run: |
                for project in LabTests AcceptanceTests; do
                  dotnet test "tests/QueryDoctor.$project" --no-build --configuration Release \
                    --logger "trx;LogFileName=$project-${{ matrix.platform }}.trx" \
                    --logger "console;verbosity=normal" \
                    --results-directory "$RUNNER_TEMP/acceptance-results"
                done

            - name: Publicar resultados (trx con el trait Criterio por prueba)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: acceptance-${{ matrix.platform }}
                path: ${{ runner.temp }}/acceptance-results/*.trx
                if-no-files-found: warn

            - name: Detener SQL Server
              if: always()
              run: docker rm -f qd-lab || true

    web:
        name: Frontend (pruebas de vista)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Descargar codigo
              uses: actions/checkout@v7

            - name: Setup de Node
              uses: actions/setup-node@v4
              with:
                node-version: "22"

            - name: Pruebas frontend
              run: node --test tests/web/explanation_view.test.mjs tests/web/wizard_and_core.test.mjs tests/web/plan_graph.test.mjs tests/web/css_and_tabs.test.mjs

    ai-service:
        name: AI Service (pytest)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Descargar codigo
              uses: actions/checkout@v7

            - name: Setup de Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: Instalar dependencias verificadas
              working-directory: ai-service
              run: "pip install --require-hashes --only-binary=:all: -r requirements.lock"

            - name: Pruebas de ai-service
              working-directory: ai-service
              run: pytest

    docker:
        name: Docker (build de imagenes)
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Descargar codigo
              uses: actions/checkout@v7

            - name: Construir imagen de la api
              run: docker build --target api -t qd-api-ci .

            - name: Construir imagen del worker
              run: docker build --target worker -t qd-worker-ci .

            - name: Construir imagen de web
              run: docker build -f web/nginx/Dockerfile -t qd-web-ci ./web

            - name: Construir imagen de ai
              run: docker build -t qd-ai-ci ./ai-service

            - name: Validar docker-compose.yml
              run: |
                mkdir -p secrets
                # Crea un archivo de relleno por cada secreto que declara el compose
                grep -oE 'file: \./secrets/[A-Za-z0-9_.-]+' docker-compose.yml \
                  | sed 's#file: ./##' | while read -r f; do echo "ci-placeholder" > "$f"; done
                docker compose config --quiet