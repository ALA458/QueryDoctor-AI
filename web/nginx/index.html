<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="same-origin">
  <title>Centro de control · Query Doctor AI</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
  <link rel="stylesheet" href="/assets/css/workbench.css">
  <script src="/assets/js/qd-core.js" defer></script>
  <script src="/assets/js/wizard-state.js" defer></script>
  <script src="/assets/js/wizard-ui.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
</head>
<body data-page="connections" data-nav="connections">
  <div class="app">
    <aside class="side"></aside>

    <main class="main" id="main" hidden>
      <header class="page-head">
        <div>
          <p class="eyebrow" id="page-eyebrow">Observabilidad de flota</p>
          <h1>Centro de control</h1>
          <p class="sub" id="page-sub">Estado operativo de tus instancias SQL Server, capacidades de Query Store, recolecciones programadas y acceso rápido al diagnóstico.</p>
        </div>
        <div class="btn-row" id="head-actions">
          <a class="btn btn-auto btn-secondary" href="/consultas">Explorar consultas →</a>
          <button type="button" class="btn btn-auto" id="btn-wizard" hidden>
            <span>+ Nueva conexión</span>
          </button>
        </div>
      </header>

      <section class="kpi-strip" id="kpi-strip" aria-label="Indicadores generales"></section>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <section id="list" aria-live="polite"></section>
    </main>
  </div>

  <!-- Modal directo paso a paso de nueva conexión -->
  <dialog class="wizard-dialog" id="wizard-dialog" aria-labelledby="wizard-dialog-title">
    <div class="wizard-dialog-head">
      <div>
        <p class="eyebrow" id="wizard-dialog-kicker">Nueva conexión · Paso a paso</p>
        <h2 id="wizard-dialog-title">Conectar instancia SQL Server</h2>
      </div>
      <button type="button" class="drawer-close" id="wizard-dialog-close">Cerrar ✕</button>
    </div>
    <div class="wizard-dialog-body" id="wizard-modal-host"></div>
  </dialog>

  <!-- Drawer lateral de detalle de conexión -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <div class="drawer-head">
      <div>
        <p class="eyebrow" id="drawer-eyebrow">Instancia monitoreada</p>
        <h2 id="drawer-title">—</h2>
        <p class="drawer-sub" id="drawer-sub">—</p>
      </div>
      <button type="button" class="drawer-close" id="drawer-close">Cerrar ✕</button>
    </div>

    <div class="tab-bar" role="tablist" aria-label="Secciones de la conexión">
      <button type="button" class="tab-btn" role="tab" id="tab-btn-caps" aria-selected="true" data-tab="caps">Capacidades</button>
      <button type="button" class="tab-btn" role="tab" id="tab-btn-ingest" aria-selected="false" data-tab="ingest">Ingestas</button>
      <button type="button" class="tab-btn" role="tab" id="tab-btn-retention" aria-selected="false" data-tab="retention" hidden>Retención y datos</button>
    </div>

    <div class="drawer-body">
      <div id="drawer-notice" class="notice" role="alert"></div>
      <section id="tab-caps"></section>
      <section id="tab-ingest" hidden></section>
      <section id="tab-retention" hidden></section>
    </div>
  </aside>
</body>
</html>
