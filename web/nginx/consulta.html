<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="same-origin">
  <title>Detalle de consulta · Query Doctor AI</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
  <link rel="stylesheet" href="/assets/css/workbench.css">
  <link rel="stylesheet" href="/assets/css/consulta.css">
  <script src="/assets/js/qd-core.js" defer></script>
  <script src="/assets/js/explanation-view.js" defer></script>
  <script src="/assets/js/plan-graph.js" defer></script>
  <script src="/assets/js/consulta.js" defer></script>
</head>
<body data-page="query-detail" data-nav="queries">
  <div class="app">
    <aside class="side" aria-label="Barra lateral de navegación"></aside>

    <main class="main" id="main" hidden>
      <nav class="breadcrumb" aria-label="Ruta de navegación">
        <a href="/consultas">← Volver al explorador de consultas</a>
      </nav>

      <header class="page-head">
        <div>
          <p class="eyebrow" id="q-context">Diagnóstico de consulta</p>
          <h1>Detalle de consulta</h1>
          <p class="sub" id="q-meta">Cargando información de la consulta...</p>
        </div>
        <div class="window-box">
          <label for="f-window">Ventana</label>
          <div class="control">
            <select id="f-window">
              <option value="24h">Últimas 24 horas</option>
              <option value="7d">Últimos 7 días</option>
              <option value="30d">Últimos 30 días</option>
            </select>
          </div>
        </div>
      </header>

      <output id="notice" class="notice" aria-live="polite"></output>
      <section id="detail-root" aria-live="polite"></section>
    </main>
  </div>
</body>
</html>
