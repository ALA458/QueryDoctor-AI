server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Cabeceras de seguridad (RNF-SEG-07; Arquitectura §8)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
    server_tokens off;

    # URLs limpias para las páginas de acceso
    location = /login { try_files /login.html =404; }
    location = /cambiar-contrasena { try_files /cambiar-contrasena.html =404; }
    location = /consultas { try_files /consultas.html =404; }

    # Recursos estáticos propios: /assets/* (CSS, JS, fuentes). La CSP no permite CDN.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
    }

    # La SPA (por ahora, las páginas de acceso y una página de inicio de prueba)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que empieza por /api/ va al contenedor api, quitando el prefijo /api
    location ^~ /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}