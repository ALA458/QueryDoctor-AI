<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="same-origin">
  <title>Explorador de consultas · Query Doctor AI</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
  <link rel="stylesheet" href="/assets/css/workbench.css">
  <link rel="stylesheet" href="/assets/css/consultas.css">
  <script src="/assets/js/qd-core.js" defer></script>
  <script src="/assets/js/consultas.js" defer></script>
</head>
<body data-page="queries" data-nav="queries">
  <div class="app">
    <aside class="side"></aside>

    <main class="main" id="main" hidden>
      <header class="page-head">
        <div>
          <p class="eyebrow">Triage y diagnóstico</p>
          <h1>Explorador de consultas</h1>
          <p class="sub">Consultas priorizadas por participación en consumo o Query Health Score, junto con los hallazgos determinísticos detectados sobre su plan de ejecución.</p>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-sm btn-secondary" id="f-reset" hidden>Restablecer filtros</button>
        </div>
      </header>

      <section class="kpi-strip" id="q-summary-strip" aria-label="Resumen de consultas filtradas"></section>

      <section class="surface-card filters-card">
        <form class="filters" id="filters" aria-label="Filtros del listado">
          <div class="field">
            <label for="f-connection">Conexión</label>
            <div class="control"><select id="f-connection"><option value="">Todas las autorizadas</option></select></div>
          </div>
          <div class="field">
            <label for="f-window">Ventana</label>
            <div class="control">
              <select id="f-window">
                <option value="24h">Últimas 24 horas</option>
                <option value="7d">Últimos 7 días</option>
                <option value="30d">Últimos 30 días</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="f-severity">Severidad mínima / filtro</label>
            <div class="control">
              <select id="f-severity">
                <option value="">Todas</option>
                <option value="High">Alta</option>
                <option value="Medium">Media</option>
                <option value="Low">Baja</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="f-sort">Ordenar por</label>
            <div class="control">
              <select id="f-sort">
                <option value="consumption">Porcentaje de consumo</option>
                <option value="score">Query Health Score</option>
              </select>
            </div>
          </div>
        </form>
        <div class="chip-bar" id="q-active-chips" hidden></div>
      </section>

      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <section id="list" aria-live="polite"></section>
    </main>
  </div>
</body>
</html>
